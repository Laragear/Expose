name: Tests

on:
  push:
  pull_request:

jobs:
  byte_level:
    name: 0️⃣ Byte-level

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check file permissions
        run: |
          test "$(find . -type f -not -path './.git/*' -not -path './sandbox/*' -executable)" == ""

      - name: Find non-printable ASCII characters
        run: |
          ! LC_ALL=C.UTF-8 find ./src -type f -name "*.php" -print0 | xargs -0 -- grep -PHn "[^ -~]"

  syntax_errors:
    name: 1️⃣ Syntax errors

    runs-on: ubuntu-latest

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          tools: parallel-lint

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Check source code for syntax errors
        run: composer exec -- parallel-lint src/

  unit_tests:
    name: 2️⃣ Unit and Feature tests ${{ matrix.php }} – ${{ matrix.os }}
    needs:
      - byte_level
      - syntax_errors

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - 8.3
          - 8.4
          - 8.5
        # os: [ubuntu-latest, macos-latest, windows-latest] Someday I will give a damn about Windows
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, dom, fileinfo, pcre, zip
          coverage: xdebug
          tools: composer:v2

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Execute unit tests
        run: composer run-script test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Laragear/Expose

  static_analysis:
    name: 3️⃣ Static Analysis
    needs:
      - byte_level
      - syntax_errors

    runs-on: ubuntu-latest

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          tools: phpstan
          php-version: latest
          coverage: none

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Execute static analysis
        run: composer exec -- phpstan analyze -l 5 src/

  exported_files:
    name: 4️⃣ Exported files
    needs:
      - byte_level
      - syntax_errors

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check exported files
        run: |
          EXPECTED="LICENSE.md,README.md,composer.json,helpers/,helpers/helpers.php"
          CURRENT="$(git archive HEAD | tar --list --exclude="src" --exclude="src/*" --exclude=".stubs" --exclude=".stubs/*"  --exclude="routes" --exclude="routes/*" --exclude="stubs" --exclude="stubs/*" --exclude="lang" --exclude="lang/*" --exclude="config" --exclude="config/*" --exclude="database" --exclude="database/*" --exclude="resources" --exclude="resources/*" | paste -s -d ",")"
          echo "CURRENT =${CURRENT}"
          echo "EXPECTED=${EXPECTED}"
          test "${CURRENT}" == "${EXPECTED}"
